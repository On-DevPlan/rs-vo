name: Publish to npm

# npm 包自动发布.
#
# 触发方式:
#   workflow_run: build-rs-vo.yml 在 main 分支成功后
#
# 为什么不用 push 触发: build-rs-vo 会把编译好的二进制提交回仓库, 且 CI 用
# GITHUB_TOKEN 推送不会触发下游 workflow. 用 workflow_run 保证「先有最新二进制,
# 再发 npm」这个顺序, 避免 push 时两个 workflow 并行导致发出旧二进制.
#
# 幂等性两层: git tag 已存在则跳过; npm 上已有该版本则跳过 publish.

on:
  workflow_run:
    workflows: [build-rs-vo]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 必须 checkout 触发它的那个 run 的 commit (含刚提交回仓库的二进制),
          # 而不是默认的当前 main HEAD.
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: 校验二进制存在
        shell: bash
        run: |
          set -euo pipefail
          test -f binaries/win32-x64/rs-vo.exe || { echo "::error::binaries/win32-x64/rs-vo.exe 不存在"; exit 1; }
          ls -lh binaries/win32-x64/rs-vo.exe

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Check if version exists on npm
        id: npm_check
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          if npm view "$PKG_NAME@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: steps.npm_check.outputs.published == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}