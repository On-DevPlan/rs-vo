name: Publish binary subpackage

# 二进制子包 @flowot/rs-vo-win32-x64 自动发布.
#
# 触发方式:
#   push to main (binaries/win32-x64/** 路径变更)
#
# 不再用 workflow_run + artifact 下载那套 (在 Actions 里有权限/保留期坑),
# 改成 build-rs-vo.yml 把二进制 commit 回 repo, 这里直接从 repo checkout 拿.

on:
  push:
    branches: [main]
    paths:
      - 'binaries/win32-x64/**'
      - '.github/workflows/publish-binary.yml'

permissions:
  contents: read
  id-token: write

jobs:
  publish-binary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 校验二进制存在
        shell: bash
        run: |
          set -euo pipefail
          test -f binaries/win32-x64/rs-vo.exe || { echo "::error::binaries/win32-x64/rs-vo.exe 不存在"; exit 1; }
          ls -lh binaries/win32-x64/rs-vo.exe

      - name: 读版本号
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 准备子包目录
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p binary-subpkg/bin
          cp binaries/win32-x64/rs-vo.exe binary-subpkg/bin/rs-vo.exe
          ls -lh binary-subpkg/bin/

      - name: 生成子包 package.json
        shell: bash
        run: |
          set -euo pipefail
          cat > binary-subpkg/package.json <<EOF
          {
            "name": "@flowot/rs-vo-win32-x64",
            "version": "${{ steps.version.outputs.version }}",
            "description": "Pre-built rs-vo binary for Windows x64 (WASAPI shared mode + loopback)",
            "license": "MIT",
            "os": ["win32"],
            "cpu": ["x64"],
            "files": ["bin/"],
            "bin": {
              "rs-vo": "bin/rs-vo.exe"
            },
            "repository": {
              "type": "git",
              "url": "https://github.com/On-DevPlan/rs-vo.git"
            }
          }
          EOF
          echo "--- 子包 package.json ---"
          cat binary-subpkg/package.json

      - name: 检查子包版本是否已在 npm
        id: npm_check
        shell: bash
        run: |
          set -euo pipefail
          if npm view "@flowot/rs-vo-win32-x64@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 发布到 npm
        if: steps.npm_check.outputs.published == 'false'
        working-directory: binary-subpkg
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}